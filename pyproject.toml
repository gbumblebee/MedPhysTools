[project]
name = "pymphub"
version = "0.1.0"
description = "Hub du physicien médical : cahier de labo, archive versionnée et analyses de CQ"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "gbumblebee" }
]
requires-python = ">=3.12"
dependencies = [
    "dulwich>=1.2.20",
    "gtc>=1.5.1",
    "lmfit>=1.3.4",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "openpyxl>=3.1.5",
    "pandas>=3.1.0",
    "pint>=0.26.2",
    "pydantic>=2.14.2",
    "pydicom>=3.0.2",
    "pyside6-essentials>=6.12.0",
    "python-gdcm>=3.2.6",
    "scipy>=1.18.1",
    "tomli-w>=1.2.0",
]

[project.scripts]
pymphub = "pymphub.interface.application:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "metrolopy>=1.1.1",
    "pyjpegls>=1.5.1",
    "pylibjpeg>=2.1.0",
    "pylibjpeg-openjpeg>=2.6.0",
    "pypdf>=6.21.4",
    "pytest>=9.2.0",
    "pytest-qt>=4.5.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# Les exemples de code de la documentation gardent leur mise en forme.
extend-exclude = ["docs"]

[tool.ruff.lint]
# Règles par défaut de ruff, tri des imports (I) et annotations de type (ANN).
select = ["E4", "E7", "E9", "F", "I", "ANN"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]
